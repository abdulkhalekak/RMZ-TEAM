name: Build and Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Build APK with Clipboard Plugin
        run: |
          # রিপোজিটরির নাম অটো ডিটেক্ট
          REPO_NAME=$(basename $GITHUB_WORKSPACE)
          echo "Repository name: $REPO_NAME"
          
          cordova create app com.rmzteam.toolshub "RMZ Tools Hub"
          cd app
          cordova platform add android
          
          # Clipboard প্লাগইন যোগ
          cordova plugin add cordova-plugin-clipboard
          
          rm -rf www/*
          cp ../index.html www/index.html
          
          # Debug বিল্ড
          cordova build android --debug
          
          # APK খুঁজে বের করে কপি (সঠিক পাথে)
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "APK found at: $APK_PATH"
          
          # ওয়ার্কস্পেসে কপি
          cp "$APK_PATH" $GITHUB_WORKSPACE/RMZ-Tools-Hub.apk
          
          # ভেরিফাই
          ls -la $GITHUB_WORKSPACE/RMZ-Tools-Hub.apk
      
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RMZ Tools Hub v1.0.${{ github.run_number }}"
          files: ${{ github.workspace }}/RMZ-Tools-Hub.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
