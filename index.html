        .fa-copy-btn:hover {

        .fa-status {

        @media (max-width: 600px) {

            iframe { min-height: 70vh; }
            .telegram-btn { width: 50px; height: 50px; }

<!-- কপি নোটিফিকেশন -->
<div id="copyToast" class="copy-toast">✅ কপি হয়েছে!</div>

<script>
    // ট্যাব সুইচিং
    const tabs = document.querySelectorAll('.tab-btn');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            tabs.forEach(b => b.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        });
    });
    
    // ============ 2FA জেনারেটর (পেস্ট করলেই অটো) ============
    const secretInput = document.getElementById('secretKeyInput');
    const keyDisplayArea = document.getElementById('keyDisplayArea');
    const generatedCodeSpan = document.getElementById('generatedCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const codeStatus = document.getElementById('codeStatus');
    const copyToast = document.getElementById('copyToast');
    
    // টোস্ট দেখানোর ফাংশন
    function showToast() {
        copyToast.classList.add('show');
        setTimeout(() => {
            copyToast.classList.remove('show');
        }, 1500);
    }
    
    // Base32 ডিকোড (রফতানির জন্য)
    function base32toBytes(base32) {
        const base32Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let cleaned = base32.toUpperCase().replace(/[^A-Z2-7]/g, '');
        let bits = 0;
        let value = 0;
        let output = [];
        
        for (let i = 0; i < cleaned.length; i++) {
            const idx = base32Chars.indexOf(cleaned[i]);
            if (idx === -1) continue;
            value = (value << 5) | idx;
            bits += 5;
            if (bits >= 8) {
                output.push((value >> (bits - 8)) & 0xff);
                bits -= 8;
            }
        }
        return new Uint8Array(output);
    }
    
    // TOTP জেনারেট (RFC 6238)
    async function generateTOTP(secret) {
        if (!secret || secret.trim() === '') return null;
        
        try {
            // বর্তমান সময়ের কাউন্টার (30 সেকেন্ডের স্লট)
            const counter = Math.floor(Date.now() / 30000);
            const counterBuffer = new ArrayBuffer(8);
            const counterView = new DataView(counterBuffer);
            counterView.setUint32(4, Math.floor(counter / 0x100000000));
            counterView.setUint32(8, counter);
            
            const key = base32toBytes(secret);
            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                key,
                { name: 'HMAC', hash: 'SHA-1' },
                false,
                ['sign']
            );
            
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, counterBuffer);
            const hmac = new Uint8Array(signature);
            const offset = hmac[hmac.length - 1] & 0x0f;
            const binary = ((hmac[offset] & 0x7f) << 24) |
                          ((hmac[offset + 1] & 0xff) << 16) |
                          ((hmac[offset + 2] & 0xff) << 8) |
                          (hmac[offset + 3] & 0xff);
            
            const otp = binary % 1000000;
            return otp.toString().padStart(6, '0');
        } catch(e) {
            console.error('TOTP Error:', e);
            return null;
        }
    }
    
    // অটো জেনারেট এবং আপডেট (প্রতি সেকেন্ডে)
    let updateInterval = null;
    
    async function updateCode() {
        const secret = secretInput.value.trim();
        if (!secret) {
            keyDisplayArea.style.display = 'none';
            if (updateInterval) clearInterval(updateInterval);
            return;
        }
        
        const code = await generateTOTP(secret);
        if (code) {
            keyDisplayArea.style.display = 'block';
            generatedCodeSpan.textContent = code;
            
            // কাউন্টডাউন দেখানো (বাকি সেকেন্ড)
            const remaining = 30 - (Math.floor(Date.now() / 1000) % 30);
            codeStatus.textContent = `⏱️ ${remaining} সেকেন্ডে পরিবর্তন হবে`;
        } else {
            keyDisplayArea.style.display = 'block';
            generatedCodeSpan.textContent = '❌ ভুল সিক্রেট কী';
            codeStatus.textContent = 'সঠিক Base32 ফরম্যাটে কী দিন';
        }
    }
    
    // পেস্ট করলেই অটোমেটিক জেনারেট
    secretInput.addEventListener('paste', function(e) {
        setTimeout(() => {
            updateCode();
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(updateCode, 1000);
        }, 50);
    });
    
    // ম্যানুয়াল টাইপ করলেও কাজ করবে
    secretInput.addEventListener('input', function() {
        updateCode();
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(updateCode, 1000);
    });
    
    // কোড কপি করার ফাংশন
    copyCodeBtn.addEventListener('click', async function() {
        const code = generatedCodeSpan.textContent;
        if (code && code !== '----' && !code.includes('❌')) {
            try {
                await navigator.clipboard.writeText(code);
                showToast();
                codeStatus.textContent = '✅ কপি হয়েছে!';
                setTimeout(() => {
                    if (codeStatus.textContent === '✅ কপি হয়েছে!') {
                        const remaining = 30 - (Math.floor(Date.now() / 1000) % 30);
                        codeStatus.textContent = `⏱️ ${remaining} সেকেন্ডে পরিবর্তন হবে`;
                    }
                }, 2000);
            } catch(err) {
                alert('কপি করতে ব্যর্থ হয়েছে');
            }
        } else {
            alert('কোনো বৈধ কোড নেই');
        }
    });
    
    // iframe এর জন্য টোস্ট (অন্যান্য ট্যাব)
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(iframe => {
        iframe.addEventListener('load', () => {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.addEventListener('copy', () => setTimeout(showToast, 100));
            } catch(e) {}
        });
    });
</script>
</body>
